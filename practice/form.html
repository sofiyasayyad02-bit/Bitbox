<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form using html</title>
</head>

<body>
    <h2 align="center">Student Registration</h2>

    <form align="center">
        <input type="text" placeholder="enter your name" required><br><br>
        <input type="text" placeholder="enter your username" required><br><br>
        <input type="email" placeholder="enter your email" required><br><br>
        <input type="password" placeholder="enter your password" required><br><br>
        <input type="password" placeholder="confirm password" required><br><br>
        <button style="background-color: brown; color: antiquewhite; padding: 10px; border-radius: 50%;">Register</button>
    </form>
</body>

</html>
