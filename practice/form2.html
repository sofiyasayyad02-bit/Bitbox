<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>
        body {
            margin: 0;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 380px;
            height: 240px;
            background-color: #F1E7BA;
            padding: 30px;

            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);

            box-sizing: border-box;
        }

        .login-box h3 {
            color: white;
            margin: 0 0 8px 0;
            font-size: 16px;
        }

        input {
            width: 100%;
            height: 30px;
            margin-bottom: 12px;
            padding: 5px;
            box-sizing: border-box;
            border: none;
        }

        button {
            width: 100%;
            height: 50px;
            margin-top: 10px;
            background-color: #E84420;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h3>Enter Username</h3>
        <input type="text" placeholder="Enter email ID">

        <h3>Enter Password</h3>
        <input type="password" placeholder="Password here">

        <button>Login</button>

    </div>

</body>
</html>
